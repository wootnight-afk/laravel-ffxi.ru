# ------------------------------------------------------------------
# Nginx server block for the local development stack (spec section 4).
# Production runs on Timeweb nginx/Apache; this file is dev-only.
# Document root points to Laravel's public/ directory (spec section 8).
# ------------------------------------------------------------------

server {
    listen 80;
    server_name _;

    # Laravel public directory. The project root is bind-mounted at
    # /var/www/html by docker-compose.yml; only public/ is exposed.
    root /var/www/html/public;
    index index.php index.html;

    # Max upload size must stay consistent with php.ini
    # (upload_max_filesize / post_max_size, spec section 12).
    client_max_body_size 32M;

    charset utf-8;

    # Logs go to stdout/stderr so `docker compose logs web` shows them.
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # Front controller: try the requested file, then directory, then
    # fall back to public/index.php (standard Laravel rewrite).
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Pass PHP requests to the app container via the FPM upstream.
    # The hostname "app" resolves inside the ffxi_laravel_network.
    location ~ \.php$ {
        try_files $uri =404;

        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO       $fastcgi_path_info;

        # Prevent Nginx from buffering large uploads to disk too soon.
        fastcgi_request_buffering off;
        fastcgi_read_timeout 120s;
    }

    # Deny access to dotfiles (.env, .git, .htaccess, etc.).
    location ~ /\. {
        deny all;
        return 404;
    }

    # Deny access to common sensitive paths that must never be served.
    location ~* /(storage/logs|storage/framework|bootstrap/cache)/ {
        deny all;
        return 404;
    }

    # Long-lived cache for Vite build output (public/build/).
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Cache for Laravel's public storage symlink (user uploads).
    location /storage/ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Favicon and robots: served with light caching to reduce noise.
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}
