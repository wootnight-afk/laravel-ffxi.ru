; ------------------------------------------------------------------
; PHP settings for the local development stack (spec section 4).
; Loaded by the app container via docker/php/Dockerfile.
; Values here are dev-only and MUST NOT be copied verbatim to
; production: Timeweb limits are audited separately (spec section 7)
; and enforced in validation rules (spec section 12).
; ------------------------------------------------------------------

[PHP]
; Errors: show everything in dev, log to stderr so they appear in
; `docker compose logs app`.
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
error_log = /dev/stderr

; Timezone: matches APP_TIMEZONE=UTC in .env.example (spec section 4).
date.timezone = UTC

; Memory: generous for Composer, Pest and intervention/image workloads
; in dev. Production is bound by Timeweb (spec section 7).
memory_limit = 512M

; Execution time: long enough for `composer install`, migrations and
; image jobs triggered synchronously during development.
max_execution_time = 120

; File uploads: aligned with the image-processing plan (spec section 12).
; Real production limits are tighter and audited at stage 0.
upload_max_filesize = 32M
post_max_size = 32M
max_file_uploads = 20

; Input limits.
max_input_time = 60
max_input_vars = 3000

; Realpath cache: small but positive; helps Composer and Laravel bootstrap.
realpath_cache_size = 4096k
realpath_cache_ttl = 600

[opcache]
; OPcache is enabled for realistic behaviour, but without strict
; validate_timestamps=0 — dev needs to pick up file changes immediately.
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.save_comments = 1
